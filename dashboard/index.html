<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI-Agent-OS Live Monitoring</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>OMNI-Agent-OS Dashboard</h1>
        <div id="connection-status" class="status connected">Connected</div>
    </header>

    <main>
        <section class="card" id="active-task-section">
            <h2>Active Task</h2>
            <p id="task-desc">Waiting for tasks...</p>
            <span class="badge" id="task-model">Model: None</span>
        </section>

        <section class="card">
            <h2>Loaded Agents</h2>
            <ul id="agents-list" class="dynamic-list">
                <!-- Agents will be populated here -->
            </ul>
        </section>

        <section class="card">
            <h2>Active Skills</h2>
            <ul id="skills-list" class="dynamic-list">
                <!-- Skills will be populated here -->
            </ul>
        </section>
        
        <section class="card">
            <h2>Routing Status</h2>
            <div id="routing-log" class="log-box">
                <!-- Logs will appear here -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
